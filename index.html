<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>When Does Effort Matter?</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #0f141d;
      --panel-soft: #121a25;
      --stroke: #273041;
      --text: #d3dceb;
      --muted: #8b96aa;
      --accent: #8ea4c2;
      --accent-soft: rgba(142, 164, 194, 0.2);
      --warn: #b09b92;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 10% -10%, #172131 0%, var(--bg) 52%, #05070b 100%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      grid-template-rows: 1fr auto;
      gap: 12px;
      height: 100vh;
      padding: 12px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(15,20,29,0.93), rgba(11,15,22,0.92));
      border: 1px solid var(--stroke);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
    }

    .left, .right {
      padding: 14px;
      overflow: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 550;
      letter-spacing: 0.03em;
    }

    .sub {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 8px;
      margin: 9px 0;
      align-items: center;
    }

    .control label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .control .value {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .control input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      appearance: none;
      background: transparent;
      margin: 0;
      height: 20px;
    }

    .control input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, #2c3648, #3c4961);
    }

    .control input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 13px;
      height: 13px;
      margin-top: -5px;
      border-radius: 50%;
      border: 1px solid #90a7c5;
      background: #e1e8f3;
      box-shadow: 0 0 0 4px rgba(142,164,194,0.15);
    }

    .control input[type="range"]::-moz-range-track {
      height: 3px;
      border-radius: 2px;
      border: none;
      background: linear-gradient(90deg, #2c3648, #3c4961);
    }

    .control input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 1px solid #90a7c5;
      border-radius: 50%;
      background: #e1e8f3;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    button {
      background: var(--panel-soft);
      border: 1px solid var(--stroke);
      border-radius: 9px;
      color: var(--text);
      padding: 8px 7px;
      font-size: 0.77rem;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }

    button:hover { border-color: #445673; }
    button.active {
      background: linear-gradient(180deg, rgba(142,164,194,0.25), rgba(142,164,194,0.08));
      border-color: rgba(142,164,194,0.75);
    }

    .divider {
      margin: 12px 0;
      border: 0;
      border-top: 1px solid var(--stroke);
    }

    .center {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--stroke);
      color: var(--muted);
      font-size: 0.78rem;
    }

    #simCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .chart {
      border: 1px solid var(--stroke);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(13,18,26,0.8);
    }

    .chart h3 {
      margin: 0;
      padding: 8px 9px;
      font-size: 0.67rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--stroke);
    }

    .chart canvas {
      width: 100%;
      height: 130px;
      display: block;
    }

    .metrics {
      border: 1px solid var(--stroke);
      border-radius: 10px;
      padding: 10px;
      background: rgba(13,18,26,0.8);
    }

    .metric {
      display: flex;
      justify-content: space-between;
      font-size: 0.77rem;
      margin: 5px 0;
      color: var(--muted);
    }

    .metric strong { color: var(--text); font-weight: 540; }

    .observations {
      grid-column: 2 / 4;
      padding: 11px 14px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .obs {
      padding-left: 10px;
      border-left: 2px solid var(--accent-soft);
      max-width: 420px;
    }

    @media (max-width: 1200px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 520px auto auto;
      }
      .observations { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel left">
      <h1>When Does Effort Matter?</h1>
      <p class="sub">A social mobility instrument. Adjust structure, watch trajectories, and compare what effort can and cannot overcome.</p>

      <div class="row" id="presetRow">
        <button data-preset="fair">Fair-ish society</button>
        <button data-preset="elite">Elite capture</button>
        <button data-preset="volatile">Volatile world</button>
        <button data-preset="harsh">Harsh but open</button>
      </div>

      <hr class="divider" />

      <div id="controls"></div>

      <hr class="divider" />
      <div class="row">
        <button id="playPauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>

    <main class="panel center">
      <div class="topbar">
        <span id="yearLabel">Year 0</span>
        <span>Vertical axis: status · Glow: wealth · Warmth: stress</span>
      </div>
      <canvas id="simCanvas"></canvas>
    </main>

    <section class="panel right">
      <div class="charts">
        <div class="chart">
          <h3>Effort vs Outcome</h3>
          <canvas id="chartEffortOutcome"></canvas>
        </div>
        <div class="chart">
          <h3>Starting Wealth vs Outcome</h3>
          <canvas id="chartStartOutcome"></canvas>
        </div>
        <div class="chart">
          <h3>Status Distribution</h3>
          <canvas id="chartStatusHist"></canvas>
        </div>
        <div class="metrics" id="metrics"></div>
      </div>
    </section>

    <section class="panel observations" id="observations"></section>
  </div>

  <script>
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rand = () => Math.random();
    const gaussian = () => {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };

    function correlation(xs, ys) {
      const n = xs.length;
      if (n < 2) return 0;
      let sx = 0, sy = 0;
      for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; }
      const mx = sx / n, my = sy / n;
      let num = 0, vx = 0, vy = 0;
      for (let i = 0; i < n; i++) {
        const dx = xs[i] - mx;
        const dy = ys[i] - my;
        num += dx * dy;
        vx += dx * dx;
        vy += dy * dy;
      }
      const den = Math.sqrt(vx * vy);
      return den > 1e-9 ? num / den : 0;
    }

    const presets = {
      fair: {
        meritocracy: 0.72, inequality: 0.30, networkPower: 0.30, failureCost: 0.30,
        educationAccess: 0.70, capitalReturnRate: 0.30, luckVolatility: 0.35,
        population: 280, speed: 1.0
      },
      elite: {
        meritocracy: 0.30, inequality: 0.86, networkPower: 0.88, failureCost: 0.72,
        educationAccess: 0.35, capitalReturnRate: 0.72, luckVolatility: 0.25,
        population: 280, speed: 1.0
      },
      volatile: {
        meritocracy: 0.52, inequality: 0.50, networkPower: 0.52, failureCost: 0.46,
        educationAccess: 0.56, capitalReturnRate: 0.46, luckVolatility: 0.90,
        population: 280, speed: 1.3
      },
      harsh: {
        meritocracy: 0.82, inequality: 0.60, networkPower: 0.25, failureCost: 0.85,
        educationAccess: 0.52, capitalReturnRate: 0.36, luckVolatility: 0.42,
        population: 280, speed: 1.0
      }
    };

    const paramMeta = [
      ["meritocracy", "Meritocracy", 0, 1, 0.01],
      ["inequality", "Inequality", 0, 1, 0.01],
      ["networkPower", "Network power", 0, 1, 0.01],
      ["failureCost", "Failure cost", 0, 1, 0.01],
      ["educationAccess", "Education access", 0, 1, 0.01],
      ["capitalReturnRate", "Capital return", 0, 1, 0.01],
      ["luckVolatility", "Luck volatility", 0, 1, 0.01],
      ["population", "Population", 200, 400, 1],
      ["speed", "Simulation speed", 0.2, 3, 0.05]
    ];

    const world = { ...presets.fair };
    const state = {
      year: 0,
      running: true,
      agents: [],
      targetYear: 0,
      metrics: null
    };

    const controlsEl = document.getElementById("controls");
    const observationsEl = document.getElementById("observations");
    const yearLabel = document.getElementById("yearLabel");
    const metricsEl = document.getElementById("metrics");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    // Build slider controls from metadata so math and UI stay synchronized.
    for (const [key, label, min, max, step] of paramMeta) {
      const wrapper = document.createElement("div");
      wrapper.className = "control";
      wrapper.innerHTML = `
        <label for="ctrl_${key}">${label}</label>
        <span class="value" id="val_${key}"></span>
        <input id="ctrl_${key}" type="range" min="${min}" max="${max}" step="${step}" value="${world[key]}">
      `;
      controlsEl.appendChild(wrapper);

      const input = wrapper.querySelector("input");
      const value = wrapper.querySelector(".value");
      const refresh = () => {
        world[key] = key === "population" ? Math.round(+input.value) : +input.value;
        value.textContent = key === "population" ? world[key] : world[key].toFixed(2);
      };
      input.addEventListener("input", () => {
        refresh();
        if (key === "population") resetSimulation();
      });
      refresh();
    }

    function setActivePreset(name) {
      document.querySelectorAll("#presetRow button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.preset === name);
      });
    }

    document.querySelectorAll("#presetRow button").forEach(btn => {
      btn.addEventListener("click", () => {
        const p = presets[btn.dataset.preset];
        Object.assign(world, p);
        for (const [key] of paramMeta) {
          const el = document.getElementById(`ctrl_${key}`);
          el.value = world[key];
          el.dispatchEvent(new Event("input"));
        }
        setActivePreset(btn.dataset.preset);
        resetSimulation();
      });
    });
    setActivePreset("fair");

    function createAgents() {
      const agents = [];
      for (let i = 0; i < world.population; i++) {
        // Starting position reflects inequality: higher inequality stretches starting wealth/status.
        const baseClass = clamp((gaussian() * 0.16 + 0.5), 0, 1);
        const inequalityBoost = Math.pow(baseClass, lerp(1.2, 3.8, world.inequality));
        const startingWealth = clamp(0.08 + inequalityBoost * 1.5 + gaussian() * 0.05, 0.01, 3.4);

        agents.push({
          effort: clamp(0.2 + rand() * 0.8, 0, 1),
          ability: clamp(0.18 + rand() * 0.75 + gaussian() * 0.06, 0, 1),
          wealth: startingWealth,
          startingWealth,
          connections: clamp(0.05 + startingWealth * 0.25 + rand() * 0.6, 0, 1),
          luck: 0,
          stress: clamp(0.06 + rand() * 0.18, 0, 1),
          status: clamp(0.1 + startingWealth * 0.28 + rand() * 0.3, 0, 1),
          failures: 0,
          x: rand(),
          y: rand(),
          tx: rand(),
          ty: rand()
        });
      }
      return agents;
    }

    function resetSimulation() {
      state.year = 0;
      state.targetYear = 0;
      state.agents = createAgents();
      state.metrics = null;
      updateMetricsAndObservations();
    }

    function stepYear() {
      state.year += 1;
      for (const a of state.agents) {
        a.luck = gaussian() * (0.14 + world.luckVolatility * 0.45);

        const survivability = clamp(a.wealth / 1.6, 0, 1);
        const effectiveEffort = a.effort * (1 - a.stress * 0.62) * (0.45 + survivability * 0.55);

        // Ability grows from effort + institutions + resources.
        const learning = (0.018 + world.educationAccess * 0.04) * (0.35 + effectiveEffort * 0.65) * (0.45 + survivability * 0.55);
        a.ability = clamp(a.ability + learning + gaussian() * 0.01, 0, 1);

        const abilityWeight = world.meritocracy * (1 - world.networkPower * 0.35);
        const connectionWeight = world.networkPower * (1 - world.meritocracy * 0.35);
        const effortWeight = 0.22 + world.meritocracy * 0.18;

        const score =
          abilityWeight * a.ability +
          connectionWeight * a.connections +
          effortWeight * effectiveEffort +
          0.18 * a.luck +
          0.08 * clamp(a.wealth / 2, 0, 1);

        const threshold = 0.43 + gaussian() * (0.07 + world.luckVolatility * 0.08);
        const success = score > threshold;

        const capitalGain = a.wealth * (0.004 + world.capitalReturnRate * 0.018) * (0.5 + a.status * 0.8);

        if (success) {
          const gain = 0.018 + 0.06 * score + capitalGain;
          a.wealth = clamp(a.wealth + gain, 0.01, 9);
          a.status = clamp(a.status + 0.03 + score * 0.035, 0, 1);
          a.connections = clamp(a.connections + 0.01 + a.status * 0.012, 0, 1);
          a.failures = Math.max(0, a.failures - 1);
          a.stress = clamp(a.stress - 0.03 + gaussian() * 0.004, 0, 1);
        } else {
          const loss = (0.018 + world.failureCost * 0.09) * (0.5 + (1 - survivability) * 0.9);
          a.wealth = clamp(a.wealth - loss, 0.01, 9);
          a.status = clamp(a.status - (0.008 + world.failureCost * 0.035), 0, 1);
          a.failures += 1;
          a.stress = clamp(a.stress + 0.045 + world.failureCost * 0.04 + a.failures * 0.006, 0, 1);
        }

        a.status = clamp(a.status + (a.wealth - 0.8) * 0.003, 0, 1);
        a.tx = clamp(a.wealth / 9, 0, 1);
        a.ty = 1 - a.status;
      }

      state.metrics = computeMetrics();
      updateMetricsAndObservations();
      yearLabel.textContent = `Year ${state.year}`;
    }

    function computeMetrics() {
      const outcome = state.agents.map(a => a.status * 0.72 + clamp(a.wealth / 3, 0, 1) * 0.28);
      const effortArr = state.agents.map(a => a.effort);
      const startArr = state.agents.map(a => clamp(a.startingWealth / 3, 0, 1));
      const statusArr = state.agents.map(a => a.status);

      const corrEffort = correlation(effortArr, outcome);
      const corrStart = correlation(startArr, outcome);

      // Mobility index: average absolute rank movement in outcome vs start wealth.
      const n = state.agents.length;
      const byStart = [...state.agents].sort((a, b) => a.startingWealth - b.startingWealth);
      const byOutcome = [...state.agents].sort((a, b) =>
        (a.status * 0.72 + clamp(a.wealth / 3, 0, 1) * 0.28) - (b.status * 0.72 + clamp(b.wealth / 3, 0, 1) * 0.28)
      );
      const startRank = new Map();
      const outRank = new Map();
      byStart.forEach((a, i) => startRank.set(a, i));
      byOutcome.forEach((a, i) => outRank.set(a, i));
      let rankMove = 0;
      for (const a of state.agents) rankMove += Math.abs(startRank.get(a) - outRank.get(a)) / (n - 1);
      const mobility = rankMove / n;

      const topCut = Math.max(1, Math.floor(n * 0.1));
      const topStart = new Set(byStart.slice(-topCut));
      const topStatus = [...state.agents].sort((a, b) => b.status - a.status).slice(0, topCut);
      let overlap = 0;
      for (const a of topStatus) if (topStart.has(a)) overlap++;
      const topConcentration = overlap / topCut;

      return {
        corrEffort,
        corrStart,
        mobility,
        topConcentration,
        outcome,
        effortArr,
        startArr,
        statusArr
      };
    }

    function drawPopulation(ctx, canvas) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "rgba(152,172,199,0.08)");
      grad.addColorStop(1, "rgba(152,172,199,0.01)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 5; i++) {
        const y = (i / 4) * h;
        ctx.strokeStyle = "rgba(140,160,190,0.10)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      for (const a of state.agents) {
        a.x = lerp(a.x, a.tx, 0.08 * world.speed);
        a.y = lerp(a.y, a.ty, 0.08 * world.speed);

        const px = a.x * w;
        const py = a.y * h;
        const r = 1.8 + Math.sqrt(a.wealth) * 1.35;
        const stressTone = Math.floor(140 + a.stress * 95);
        const alpha = 0.35 + clamp(a.wealth / 4, 0, 0.4);

        ctx.beginPath();
        ctx.fillStyle = `rgba(${stressTone}, ${180 - a.stress * 65}, ${205 - a.stress * 75}, ${alpha})`;
        ctx.shadowBlur = 10 + a.wealth * 4;
        ctx.shadowColor = `rgba(166, 186, 215, ${0.18 + a.wealth * 0.03})`;
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    function drawScatter(canvas, xs, ys, xLabelColor = "rgba(166,186,215,0.8)") {
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      ctx.strokeStyle = "rgba(130,150,180,0.18)";
      ctx.strokeRect(26, 8, cw - 34, ch - 20);
      ctx.fillStyle = xLabelColor;
      for (let i = 0; i < xs.length; i++) {
        const x = 26 + xs[i] * (cw - 34);
        const y = (ch - 12) - ys[i] * (ch - 20);
        ctx.fillRect(x - 1.1, y - 1.1, 2.2, 2.2);
      }
    }

    function drawHistogram(canvas, values) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      const bins = 12;
      const counts = Array(bins).fill(0);
      for (const v of values) counts[Math.min(bins - 1, Math.floor(v * bins))]++;
      const maxCount = Math.max(...counts, 1);
      const barW = (cw - 30) / bins;

      ctx.strokeStyle = "rgba(130,150,180,0.18)";
      ctx.strokeRect(20, 8, cw - 26, ch - 18);
      for (let i = 0; i < bins; i++) {
        const ratio = counts[i] / maxCount;
        const bh = ratio * (ch - 26);
        const x = 22 + i * barW;
        const y = ch - 10 - bh;
        ctx.fillStyle = `rgba(145, 166, 197, ${0.25 + ratio * 0.45})`;
        ctx.fillRect(x, y, barW - 2, bh);
      }
    }

    function updateMetricsAndObservations() {
      const m = state.metrics || computeMetrics();
      metricsEl.innerHTML = `
        <div class="metric"><span>Effort ↔ Outcome</span><strong>${m.corrEffort.toFixed(2)}</strong></div>
        <div class="metric"><span>Start Wealth ↔ Outcome</span><strong>${m.corrStart.toFixed(2)}</strong></div>
        <div class="metric"><span>Mobility Index</span><strong>${m.mobility.toFixed(2)}</strong></div>
        <div class="metric"><span>Top-status concentration</span><strong>${(m.topConcentration * 100).toFixed(0)}%</strong></div>
      `;

      const notes = [];
      if (m.corrStart - m.corrEffort > 0.18) {
        notes.push("Inherited position is compounding faster than effort under current rules.");
      } else if (m.corrEffort > m.corrStart + 0.1) {
        notes.push("Effort has a clearer link to outcomes than starting wealth in this run.");
      }
      if (world.failureCost > 0.62 && m.mobility < 0.35) {
        notes.push("High failure cost is suppressing second chances and lowering mobility.");
      }
      if (world.networkPower > 0.64 && m.corrStart > 0.55) {
        notes.push("Connections are dominating late-stage advancement pathways.");
      }
      if (notes.length === 0) {
        notes.push("This world rewards persistence mostly for those able to absorb setbacks.");
      }
      observationsEl.innerHTML = notes.slice(0, 3).map(n => `<div class="obs">${n}</div>`).join("");
    }

    const simCanvas = document.getElementById("simCanvas");
    const effortChart = document.getElementById("chartEffortOutcome");
    const startChart = document.getElementById("chartStartOutcome");
    const histChart = document.getElementById("chartStatusHist");

    function resizeSimCanvas() {
      simCanvas.width = simCanvas.clientWidth * devicePixelRatio;
      simCanvas.height = simCanvas.clientHeight * devicePixelRatio;
      const ctx = simCanvas.getContext("2d");
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    playPauseBtn.addEventListener("click", () => {
      state.running = !state.running;
      playPauseBtn.textContent = state.running ? "Pause" : "Play";
    });

    resetBtn.addEventListener("click", resetSimulation);

    let accumulator = 0;
    let last = performance.now();
    function animate(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (state.running) {
        accumulator += dt * world.speed;
        while (accumulator >= 0.22) {
          stepYear();
          accumulator -= 0.22;
        }
      }

      const ctx = simCanvas.getContext("2d");
      drawPopulation(ctx, simCanvas);
      const m = state.metrics || computeMetrics();
      drawScatter(effortChart, m.effortArr, m.outcome);
      drawScatter(startChart, m.startArr, m.outcome, "rgba(193,173,160,0.86)");
      drawHistogram(histChart, m.statusArr);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      resizeSimCanvas();
    });

    resetSimulation();
    resizeSimCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
